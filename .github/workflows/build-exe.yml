name: Build executables

on:
  push:
    # Both cases: existing releases are tagged V1.0.x (uppercase), and tag
    # globs are case-sensitive, so 'v*' alone would silently never match them.
    tags: ['v*', 'V*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: file-scanner-windows
            binary: file-scanner.exe
          - os: ubuntu-latest
            artifact: file-scanner-linux
            binary: file-scanner
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libegl1 libgl1 libfontconfig1 libxkbcommon0 libdbus-1-3

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Build with Nuitka
        run: uv run --frozen --group build nuitka main.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.binary }}
          generate_release_notes: true
