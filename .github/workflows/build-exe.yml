name: Build executables

on:
  push:
    # Both cases: existing releases are tagged V1.0.x (uppercase), and tag
    # globs are case-sensitive, so 'v*' alone would silently never match them.
    tags: ['v*', 'V*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: file-scanner-windows
            binary: file-scanner.exe
          - os: ubuntu-latest
            artifact: file-scanner-linux
            binary: file-scanner
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libegl1 libgl1 libfontconfig1 libxkbcommon0 libdbus-1-3

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Build with Nuitka
        run: uv run --frozen --group build nuitka main.py

      # Nuitka can print a FATAL error (e.g. a failed non-interactive tool
      # download) yet still exit 0, which would otherwise leave this whole job
      # showing green while upload-artifact silently uploads nothing - confirmed
      # directly: exactly this happened on a real build (see main.py's
      # --assume-yes-for-downloads comment) and it took a missing release
      # asset to notice. Fail loudly here instead.
      - name: Verify binary was actually produced
        shell: bash
        run: test -f "${{ matrix.binary }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  release:
    # A single job (not per-matrix-build) attaches both binaries to the
    # release in one action-gh-release call. Two parallel matrix jobs each
    # calling action-gh-release against the same tag raced in practice: the
    # second call's generate_release_notes duplicated the release notes, and
    # depending on timing a still-uploading asset could be clobbered too.
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
