[project]
name = "file-scanner"
version = "2.0.0"
description = "Scan a batch of files (PDF/DOCX/TXT) for keywords and show a found/missing grid."
requires-python = ">=3.11,<3.13"
dependencies = [
    "PyQt6>=6.7",
    "PyMuPDF>=1.24",
    "docx2txt>=0.8",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]
build = [
    "nuitka>=2.4",
    "pywin32-ctypes>=0.2.3; sys_platform == 'win32'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "scanner", "options_dialog", "main_window"]
