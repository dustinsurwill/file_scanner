[project]
name = "file-scanner"
dynamic = ["version"]
description = "Scan a batch of files (PDF/DOCX/TXT) for keywords and show a found/missing grid."
requires-python = ">=3.14"
dependencies = [
    "PyQt6>=6.7",
    "pypdfium2>=4.30",
    "docx2txt>=0.8",
    "openpyxl>=3.1",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "reportlab>=4.0",
]
build = [
    "nuitka>=2.4",
    "pywin32-ctypes>=0.2.3; sys_platform == 'win32'",
]
lint = [
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "scanner", "options_dialog", "main_window"]

[tool.setuptools_scm]
# Derives the package version from the latest git tag (e.g. v2.1.0 -> 2.1.0)
# so it never needs to be bumped by hand or drift out of sync with releases.
fallback_version = "0.0.0"
